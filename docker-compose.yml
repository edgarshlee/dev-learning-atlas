services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - atlas-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  atlas-postgres:

